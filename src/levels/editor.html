<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Трешка — редактор уровней</title>
  <style>
    body { margin: 0; padding: 16px; font: 14px system-ui, sans-serif; background: #1b1035; color: #eee; display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
    fieldset { border: 1px solid #55468a; margin: 0 0 12px; padding: 8px 12px; }
    legend { color: #b9a8ff; }
    label { display: inline-block; margin: 2px 8px 2px 0; }
    input[type=number], select, input[type=text] { width: 64px; background: #2b1d55; color: #eee; border: 1px solid #55468a; border-radius: 4px; padding: 2px 4px; }
    button { background: #4b3a8f; color: #fff; border: 0; border-radius: 4px; padding: 4px 10px; margin: 2px; cursor: pointer; }
    button.on { background: #e0a030; color: #000; }
    #grid { display: grid; gap: 2px; user-select: none; touch-action: none; }
    .cell { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-weight: bold; border-radius: 4px; background: #3a2b70; position: relative; }
    .cell.hole { background: #120a26; }
    .cell.ice { background: #5ab4e8; color: #05324d; }
    .cell.chain { background: #8a8a98; color: #111; }
    .cell.crate { background: #a0702f; color: #2a1800; }
    .cell.slime { background: #5ec04e; color: #0d3300; }
    .cell .sp { position: absolute; right: 1px; bottom: 0; font-size: 10px; background: #000a; padding: 0 2px; border-radius: 3px; color: #fff; }
    #errors { color: #ff8080; margin: 0; padding-left: 18px; }
    #errors.ok { color: #80ff9a; list-style: none; padding: 0; }
    textarea { width: 440px; height: 320px; background: #120a26; color: #cfe; border: 1px solid #55468a; font: 12px monospace; }
    .goal { margin: 2px 0; }
  </style>
</head>
<body>
  <main>
    <fieldset><legend>Уровень</legend>
      <label>id <input id="id" type="number" min="1" value="1"></label>
      <label>ходы <input id="moves" type="number" min="1" max="99" value="20"></label>
      <label>столбцы <input id="cols" type="number" min="4" max="12" value="8"></label>
      <label>ряды <input id="rows" type="number" min="4" max="12" value="8"></label><br>
      <label>звёзды <input id="s1" type="number" min="1"> <input id="s2" type="number" min="1"> <input id="s3" type="number" min="1"></label><br>
      <span>цвета: </span><span id="colors"></span>
    </fieldset>
    <fieldset><legend>Кисть</legend><div id="tools"></div></fieldset>
    <div id="grid"></div>
  </main>
  <aside>
    <fieldset><legend>Цели <button id="addGoal">+</button></legend><div id="goals"></div></fieldset>
    <fieldset><legend>Проверка</legend><ul id="errors"></ul></fieldset>
    <fieldset><legend>JSON</legend>
      <textarea id="json" spellcheck="false"></textarea><br>
      <button id="load">Загрузить из поля</button>
      <button id="copy">Копировать</button>
      <button id="download">Скачать .json</button>
    </fieldset>
  </aside>
  <script type="module" src="editor.js"></script>
</body>
</html>
